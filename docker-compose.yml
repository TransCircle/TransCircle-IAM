name: transcircle-iam

# 单一应用容器：前端 SPA 已内嵌进后端二进制，同一个端口(8080)同时提供 UI 与
# API。容器启动时自动完成迁移与初始化。你们的 nginx 只需把该端口反代出去即可。

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iam}
      POSTGRES_DB: ${POSTGRES_DB:-iam}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iam} -d ${POSTGRES_DB:-iam}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-iamredis}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-iamredis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: make the bind-mounted data dir writable by the app's non-root
  # user (distroless nonroot = uid/gid 65532). Without this, the directory is
  # created as root by the Docker daemon and avatar uploads fail with a 500.
  app-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/avatars && chown -R 65532:65532 /data"]
    volumes:
      - ./data/app:/data
    restart: "no"

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    command: ["serve"]
    environment:
      IAM_ENV: ${IAM_ENV:-dev}
      IAM_DATABASE_URL: postgres://${POSTGRES_USER:-iam}:${POSTGRES_PASSWORD:-iam}@postgres:5432/${POSTGRES_DB:-iam}?sslmode=disable
      IAM_REDIS_URL: redis://:${REDIS_PASSWORD:-iamredis}@redis:6379/0
      IAM_ISSUER: ${IAM_ISSUER:-http://localhost}
      IAM_COOKIE_SECURE: ${IAM_COOKIE_SECURE:-}
      # 仅信任显式配置的反向代理 IP/CIDR；开发默认不采纳转发头。
      IAM_TRUSTED_PROXIES: ${IAM_TRUSTED_PROXIES:-}
      IAM_CORS_ORIGINS: ${IAM_ISSUER:-http://localhost}
      IAM_BOOTSTRAP_OUT_FILE: /var/lib/iam/bootstrap.json
      IAM_KEK_ENABLED: ${IAM_KEK_ENABLED:-}
      IAM_KEK_FILE: ${IAM_KEK_FILE:-}
    ports:
      # 安全默认：仅宿主机回环可访问。容器化 nginx 应与 app 共用 Docker 网络并直接
      # 反代 app:8080；若 nginx 在宿主机上，则访问 127.0.0.1:${APP_PORT:-8080}。
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./data/app:/var/lib/iam
    healthcheck:
      test: ["CMD", "/iam", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      app-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
